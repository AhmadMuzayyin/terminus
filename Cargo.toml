[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ssh-engine",
    "crates/sftp-engine",
    "crates/term-emulator",
    "crates/cisco-driver",
    "crates/serial-engine",
    "crates/vault",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["terminus Contributors"]
repository = "https://github.com/yourname/terminus"

# Semua versi dependency dipusatkan di sini supaya tiap crate anggota
# workspace tidak drift versi satu sama lain. Crate individu cukup
# menulis `dependency-name = { workspace = true }`.
[workspace.dependencies]
# --- async runtime ---
tokio = { version = "1", features = ["full"] }

# --- SSH / SFTP ---
# russh >=0.5x WAJIB mengaktifkan salah satu crypto backend, kalau tidak
# gagal compile. Pilih "ring" (pure Rust, gampang cross-compile ke
# Linux+macOS/ARM) daripada "aws-lc-rs" (butuh cmake/C compiler di build
# machine).
russh = { version = "0.58", features = ["ring"] }
russh-keys = "0.49"
russh-sftp = "2.1"

# --- terminal emulation (VTE parser dari project Alacritty) ---
alacritty_terminal = "0.25"

# --- serial/console (ala minicom, buat kabel console Cisco/RS-232) ---
# Wrapper async (Tokio) di atas `serialport` (crate cross-platform asli:
# Windows "COM3", Linux "/dev/ttyUSB0", macOS "/dev/cu.usbserial-*") —
# TIDAK terikat Linux saja, lihat komentar panjang di
# `crates/serial-engine/src/lib.rs`.
tokio-serial = "5"

# --- import (SecureCRT config.xml, dsb) ---
# Read-only DOM, cocok buat jalan-jalan rekursif di tree <key> nested
# SecureCRT tanpa perlu nulis balik XML apa pun.
roxmltree = "0.20"

# --- font sistem (buat pengaturan font terminal) ---
# SUDAH jadi dependency transitif Slint sendiri (dipakai i-slint-
# renderer-femtovg buat load font) — dipakai ulang di sini, bukan
# nambah dependency baru buat scan font terinstall (Linux/macOS/
# Windows semua didukung `load_system_fonts()`-nya).
fontdb = "0.23"

# --- UI ---
slint = "1.17"
slint-build = "1.17"
# Native "Open File" dialog (GTK di Linux) buat fitur Import XML.
rfd = "0.15"

# --- storage & crypto (vault) ---
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"

# --- util umum ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }

# Internal crates saling mereferensi lewat path, versi disamakan
# dengan workspace.package.version di atas.
terminus-core = { path = "crates/core" }
terminus-ssh-engine = { path = "crates/ssh-engine" }
terminus-sftp-engine = { path = "crates/sftp-engine" }
terminus-term-emulator = { path = "crates/term-emulator" }
terminus-cisco-driver = { path = "crates/cisco-driver" }
terminus-serial-engine = { path = "crates/serial-engine" }
terminus-vault = { path = "crates/vault" }

# Profil release: optimasi ukuran + kecepatan wajar untuk aplikasi desktop
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
