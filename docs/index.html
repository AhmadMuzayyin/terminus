<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminus — Dokumentasi</title>
<meta name="description" content="Dokumentasi Terminus — SSH/SFTP/Console manager native lintas platform." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d8eff'/%3E%3Ctext x='32' y='45' font-family='sans-serif' font-size='34' font-weight='700' fill='%23002e6a' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<style>
  :root {
    --surface-lowest: #060e20;
    --surface: #0b1326;
    --surface-low: #131b2e;
    --surface-container: #171f33;
    --surface-high: #222a3d;
    --surface-highest: #2d3449;
    --on-surface: #dae2fd;
    --on-surface-variant: #c2c6d6;
    --outline: #8c909f;
    --outline-variant: #424754;
    --primary: #adc6ff;
    --on-primary: #002e6a;
    --primary-container: #4d8eff;
    --success: #4edea3;
    --font-headline: "Hanken Grotesk", "Inter", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* --- Header --- */
  header.top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface-container);
    border-bottom: 1px solid var(--outline-variant);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--primary-container); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-headline); font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .brand .name { font-family: var(--font-headline); font-weight: 700; font-size: 17px; }
  .brand .tagline { font-size: 11px; color: var(--on-surface-variant); font-family: var(--font-mono); }
  header.top .spacer { flex: 1; }
  header.top a.gh {
    color: var(--on-surface-variant);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--outline-variant);
    border-radius: 6px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  header.top a.gh:hover { background: var(--surface-high); color: var(--on-surface); }
  #menu-toggle {
    display: none;
    background: none; border: 1px solid var(--outline-variant); border-radius: 6px;
    color: var(--on-surface); width: 36px; height: 36px; font-size: 18px; cursor: pointer;
  }

  /* --- Layout --- */
  .layout { flex: 1; display: flex; max-width: 1280px; width: 100%; margin: 0 auto; }
  nav.sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 20px 12px;
    border-right: 1px solid var(--outline-variant);
  }
  nav.sidebar .group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--outline); padding: 14px 12px 6px;
  }
  nav.sidebar a {
    display: block;
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--on-surface-variant);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 2px;
  }
  nav.sidebar a:hover { background: var(--surface-container); color: var(--on-surface); }
  nav.sidebar a.active { background: var(--primary-container); color: var(--on-primary); font-weight: 600; }

  main {
    flex: 1;
    min-width: 0;
    padding: 32px 40px 80px;
  }
  #content { max-width: 780px; }
  #content.loading { opacity: .5; }

  /* --- Markdown rendering --- */
  #content h1 { font-family: var(--font-headline); font-size: 30px; margin: 0 0 6px; }
  #content h2 { font-family: var(--font-headline); font-size: 21px; margin: 34px 0 12px; padding-top: 8px; border-top: 1px solid var(--outline-variant); }
  #content h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  #content h3 { font-family: var(--font-headline); font-size: 16px; margin: 22px 0 8px; color: var(--on-surface); }
  #content p, #content li { color: var(--on-surface-variant); }
  #content a { color: var(--primary); }
  #content strong { color: var(--on-surface); }
  #content code {
    font-family: var(--font-mono);
    background: var(--surface-container);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 13px;
    color: var(--success);
  }
  #content pre {
    background: var(--surface-lowest) !important;
    border: 1px solid var(--outline-variant);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  #content pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: 13px;
  }
  #content table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  #content th, #content td { border: 1px solid var(--outline-variant); padding: 8px 12px; text-align: left; }
  #content th { background: var(--surface-container); color: var(--on-surface); }
  #content blockquote {
    border-left: 3px solid var(--primary-container);
    margin: 16px 0; padding: 4px 16px; color: var(--on-surface-variant);
    background: var(--surface-container); border-radius: 0 6px 6px 0;
  }
  #content hr { border: none; border-top: 1px solid var(--outline-variant); margin: 28px 0; }
  #content ul, #content ol { padding-left: 22px; }
  #content img { max-width: 100%; border-radius: 8px; }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--outline);
    border-top: 1px solid var(--outline-variant);
  }
  footer a { color: var(--on-surface-variant); }

  @media (max-width: 860px) {
    #menu-toggle { display: block; }
    nav.sidebar {
      position: fixed; top: 61px; left: 0; bottom: 0; width: 240px;
      background: var(--surface); z-index: 15; overflow-y: auto;
      transform: translateX(-100%); transition: transform .18s ease-out;
    }
    nav.sidebar.open { transform: translateX(0); box-shadow: 8px 0 24px rgba(0,0,0,.4); }
    main { padding: 24px 20px 60px; }
  }
</style>
</head>
<body>

<header class="top">
  <button id="menu-toggle" aria-label="Buka navigasi">☰</button>
  <a class="brand" href="#/">
    <span class="logo">T</span>
    <span>
      <div class="name">Terminus</div>
      <div class="tagline">Dokumentasi</div>
    </span>
  </a>
  <div class="spacer"></div>
  <a class="gh" href="https://github.com/AhmadMuzayyin/terminus" target="_blank" rel="noopener">GitHub ↗</a>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div id="content" class="loading">Memuat…</div>
  </main>
</div>

<footer>
  Terminus — dilisensikan di bawah <a href="https://github.com/AhmadMuzayyin/terminus/blob/main/Cargo.toml" target="_blank" rel="noopener">GPL-3.0-or-later</a>.
  Sumber dokumentasi ini: <a href="https://github.com/AhmadMuzayyin/terminus/tree/main/docs" target="_blank" rel="noopener">docs/</a>.
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
<script>
  // Daftar halaman dokumentasi — TIAP section = satu folder + README.md
  // sendiri (bukan satu file markdown raksasa) supaya gampang di-maintain
  // terpisah DAN tetap kebaca rapi kalau folder-nya dibuka langsung lewat
  // GitHub UI (auto-render README.md), bukan cuma lewat situs ini.
  const PAGES = [
    { slug: "", title: "Pengenalan", file: "README.md" },
    { group: "Panduan" },
    { slug: "getting-started", title: "Instalasi", file: "getting-started/README.md" },
    { slug: "usage", title: "Menjalankan Aplikasi", file: "usage/README.md" },
    { slug: "features", title: "Fitur", file: "features/README.md" },
    { group: "Pengembangan" },
    { slug: "architecture", title: "Arsitektur", file: "architecture/README.md" },
    { slug: "testing", title: "Testing", file: "testing/README.md" },
    { slug: "packaging", title: "Packaging & Rilis", file: "packaging/README.md" },
    { group: "Proyek" },
    { slug: "roadmap", title: "Status & Roadmap", file: "roadmap/README.md" },
    { slug: "contributing", title: "Berkontribusi", file: "contributing/README.md" },
  ];

  const sidebar = document.getElementById("sidebar");
  const content = document.getElementById("content");
  const menuToggle = document.getElementById("menu-toggle");

  function buildSidebar(activeSlug) {
    sidebar.innerHTML = "";
    for (const p of PAGES) {
      if (p.group) {
        const g = document.createElement("div");
        g.className = "group-title";
        g.textContent = p.group;
        sidebar.appendChild(g);
        continue;
      }
      const a = document.createElement("a");
      a.href = "#" + p.slug;
      a.textContent = p.title;
      if (p.slug === activeSlug) a.classList.add("active");
      sidebar.appendChild(a);
    }
  }

  function findPage(slug) {
    return PAGES.find((p) => !p.group && p.slug === slug);
  }

  marked.setOptions({ gfm: true, breaks: false });

  async function loadPage() {
    const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const page = findPage(slug) || PAGES.find((p) => !p.group);
    buildSidebar(page.slug);
    content.classList.add("loading");
    try {
      const res = await fetch(page.file, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const md = await res.text();
      content.innerHTML = marked.parse(md);
      content.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
      document.title = (page.title === "Pengenalan" ? "Terminus" : page.title + " — Terminus") + " — Dokumentasi";
      window.scrollTo(0, 0);
    } catch (err) {
      content.innerHTML =
        "<h1>Gagal memuat halaman</h1><p>Tidak bisa mengambil <code>" +
        page.file +
        "</code>: " +
        String(err.message || err) +
        "</p>";
    } finally {
      content.classList.remove("loading");
    }
    sidebar.classList.remove("open");
  }

  window.addEventListener("hashchange", loadPage);
  menuToggle.addEventListener("click", () => sidebar.classList.toggle("open"));
  loadPage();
</script>
</body>
</html>
